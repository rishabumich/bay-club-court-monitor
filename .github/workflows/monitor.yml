name: Check Bay Club courts

on:
  workflow_dispatch:
  schedule:
    # Start a job every 10 minutes from 7:00 AM through 10:50 PM Pacific.
    # A randomized 0-5 minute delay below makes the intended checks land
    # 5-15 minutes apart while keeping every check before 11:00 PM.
    - cron: "*/10 7-22 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: read

concurrency:
  group: bay-club-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTIFICATION_CHANNEL: telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BAYCLUB_STORAGE_STATE_B64: ${{ secrets.BAYCLUB_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Randomize scheduled check time
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          delay_seconds=$((RANDOM % 301))
          echo "Waiting ${delay_seconds} seconds before checking Bay Club."
          sleep "${delay_seconds}"

      - name: Check availability and notify Telegram
        run: npm run monitor:once -- --config config.example.json

      - name: Save alert history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: monitor-state-${{ github.run_id }}
